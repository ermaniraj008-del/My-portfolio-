<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maniraj | Software Developer & Engineering Student</title>
<meta name="description" content="Maniraj is a software developer and Computer Science & Engineering student at Government Polytechnic Khagaria, building frontend projects with HTML, CSS and JavaScript.">
<meta name="theme-color" content="#0A1626">
<meta property="og:title" content="Maniraj | Software Developer & Engineering Student">
<meta property="og:description" content="Frontend projects, dark polished interfaces and hand-written animations, built with HTML, CSS and JavaScript.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5C242'/%3E%3Ctext x='32' y='46' font-size='40' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%230A1626'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --ink:#0A1626; --panel:#10233A; --panel2:#163050; --line:#234466;
  --gold:#F5C242; --gold-soft:#C99E2E; --sky:#5CC8FF; --mint:#7BE0B0; --rose:#FF8FA3;
  --text:#EAF0F8; --muted:#90A6C0;
  --ease:cubic-bezier(.16,1,.3,1);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--ink);color:var(--text);font-family:var(--body);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}

/* ---------- ambient background ---------- */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none}
.bg::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(35,68,102,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(35,68,102,.35) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 25%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 75% 65% at 50% 25%,#000 25%,transparent 100%)}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,194,66,.13),transparent 65%);pointer-events:none;z-index:-1;
  transform:translate3d(50vw,30vh,0);will-change:transform}

/* ---------- boot screen ---------- */
.boot{position:fixed;inset:0;z-index:200;background:var(--ink);display:none;place-items:center;
  transition:transform .9s cubic-bezier(.76,0,.24,1)}
.js .boot{display:grid;animation:bootOut .01s 4.5s forwards}
.boot.done{transform:translateY(-100%)}
@keyframes bootOut{to{visibility:hidden;opacity:0}}
.boot-in{width:min(340px,76vw);font-family:var(--mono);font-size:.95rem;color:var(--muted)}
.boot-line{color:var(--text);min-height:1.6em}
.boot-line::before{content:'> ';color:var(--gold)}
.bcur{display:inline-block;width:.6em;height:1.05em;background:var(--gold);vertical-align:-.2em;margin-left:2px;animation:blink 1s steps(1) infinite}
.boot-bar{height:4px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:18px 0 10px}
.boot-bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sky));transform-origin:0 50%;transform:scaleX(0)}
.boot-pct{text-align:right;font-size:.8rem}
@keyframes blink{50%{opacity:0}}

/* ---------- nav ---------- */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--gold),var(--sky));z-index:120}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 0;border-bottom:1px solid transparent;
  transition:background .3s,border-color .3s}
nav.scrolled{background:rgba(10,22,38,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.05rem;transition:transform .4s var(--ease)}
.brand:hover .mk{transform:rotate(-12deg) scale(1.1)}
.navlinks{display:flex;gap:4px}
.navlinks a{padding:8px 15px;border-radius:999px;color:var(--muted);font-size:.92rem;font-weight:500;transition:color .25s,background .25s}
.navlinks a:hover{color:var(--text)}
.navlinks a.active{color:var(--ink);background:var(--gold)}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;position:relative}
.burger span{position:absolute;left:11px;right:11px;height:2px;background:var(--text);border-radius:2px;transition:top .3s var(--ease),transform .3s var(--ease)}
.burger span:nth-child(1){top:15px}
.burger span:nth-child(2){top:24px}
.burger[aria-expanded="true"] span:nth-child(1){top:19.5px;transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){top:19.5px;transform:rotate(-45deg)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:.98rem;
  border:1px solid transparent;cursor:pointer;transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s,box-shadow .25s}
.btn-primary{background:var(--gold);color:var(--ink)}
.btn-primary:hover{background:#ffd76a;box-shadow:0 14px 34px -12px rgba(245,194,66,.65)}
.btn-ghost{border-color:var(--line);color:var(--text);background:rgba(16,35,58,.55)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:120px 0 80px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative;z-index:2}
.floaters span{position:absolute;left:var(--x);top:var(--y);font-family:var(--mono);font-size:var(--s);color:var(--gold);opacity:.12;
  animation:drift var(--t) ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(24px,-34px) rotate(14deg)}}
.status{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(16,35,58,.7);font-size:.88rem;color:var(--muted)}
.status .pulse{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,224,176,.6)}70%,100%{box-shadow:0 0 0 10px rgba(123,224,176,0)}}
.name{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,12.5vw,9.6rem);line-height:.98;letter-spacing:-.04em;margin:22px 0 12px}
.w{display:inline-block;white-space:nowrap}
.name .ch{display:inline-block;transition:transform .3s var(--ease),color .3s}
.name .ch:hover{transform:translateY(-.08em) skewX(-8deg);color:var(--gold)}
.js .hero .ch{opacity:0}
.ready .hero .name .ch{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i)*80ms + 200ms)}
@keyframes rise{from{opacity:0;translate:0 60%;rotate:12deg;filter:blur(10px)}to{opacity:1;translate:0 0;rotate:0deg;filter:blur(0)}}
.role{display:flex;align-items:center;font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3.2vw,2rem);min-height:1.5em;color:var(--text)}
.role #roleText{color:var(--gold)}
.role .cursor{width:3px;height:1.1em;background:var(--gold);margin-left:4px;animation:blink 1s steps(1) infinite}
.hero-p{color:var(--muted);font-size:1.1rem;max-width:52ch;margin:22px 0 34px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.js [data-hero]{opacity:0}
.ready [data-hero]{animation:fadeUp .9s var(--ease) both;animation-delay:var(--d,0ms)}
.ready .term-wrap[data-hero]{animation-name:slideIn}
@keyframes fadeUp{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes slideIn{from{opacity:0;translate:70px 0;scale:.94}to{opacity:1;translate:0 0;scale:1}}
.term-float{animation:floaty 7s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}
.term{background:linear-gradient(180deg,var(--panel),#0e1f34);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.75);font-family:var(--mono);font-size:.84rem;max-width:520px;margin-inline:auto}
.term-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.76rem}
.term-bar i{width:11px;height:11px;border-radius:50%}
.term-bar i:nth-child(1){background:#ff6b6b}
.term-bar i:nth-child(2){background:var(--gold)}
.term-bar i:nth-child(3){background:var(--mint)}
.term-bar span{margin-left:auto}
.code{padding:20px 22px;line-height:1.8;color:var(--muted)}
.ln{display:block;overflow:hidden;white-space:pre;min-height:1.8em}
.js .ln{width:0}
.ready .term-hero .ln,.project.in .ln{animation:typing var(--dur,.6s) steps(var(--n)) forwards;animation-delay:var(--d,0ms)}
@keyframes typing{to{width:calc(var(--n)*1ch)}}
.c-p{color:var(--gold)}.c-k{color:var(--sky)}.c-s{color:var(--mint)}.c-o{color:var(--text)}
.c-c{color:#6f8aa8}.c-k2{color:var(--rose)}.c-f{color:var(--sky)}.c-n{color:var(--gold)}
.caret-b{display:inline-block;background:var(--gold);color:transparent;animation:blink 1s steps(1) infinite}
.cue{position:absolute;left:50%;bottom:26px;translate:-50% 0;width:24px;height:38px;border:2px solid var(--line);border-radius:14px;z-index:2}
.cue::after{content:'';position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.8s var(--ease) infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

/* ---------- marquee ---------- */
.marquee{border-block:1px solid var(--line);background:rgba(16,35,58,.55);overflow:hidden;padding:18px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:scroll 34s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:44px;margin-right:44px;font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--muted);white-space:nowrap}
.track span::after{content:'';width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---------- sections + title animations ---------- */
section{position:relative;padding:120px 0}
.sec-head{margin-bottom:56px}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.03em}
.lede{color:var(--muted);max-width:52ch;margin-top:16px;font-size:1.05rem}
.mask{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.in-line{display:block}
.js .t-clip .in-line{transform:translateY(115%) skewY(6deg);transition:transform 1.1s var(--ease);transition-delay:calc(var(--l)*.14s)}
.js .t-clip.in .in-line{transform:none}
.js .t-blur{opacity:0;filter:blur(14px);letter-spacing:.32em;transition:opacity 1s var(--ease),filter 1s var(--ease),letter-spacing 1.4s var(--ease)}
.js .t-blur.in{opacity:1;filter:none;letter-spacing:-.03em}
.js .t-scramble,.js .t-type{visibility:hidden}
.t-type::after{content:'';display:inline-block;width:.07em;height:.85em;background:var(--gold);margin-left:.1em;animation:blink 1s steps(1) infinite}
.js .t-wave .ch{opacity:0}
.t-wave.in .ch{animation:pop .8s var(--ease) both;animation-delay:calc(var(--i)*38ms)}
.t-wave .ch{display:inline-block;transition:color .25s,transform .3s var(--ease)}
.t-wave .ch:hover{color:var(--gold);transform:translateY(-.1em)}
@keyframes pop{from{opacity:0;translate:0 70%;rotate:10deg;scale:.6}to{opacity:1;translate:0 0;rotate:0deg;scale:1}}

/* ---------- reveal variants ---------- */
.js [data-anim]{opacity:0;transition:opacity .9s var(--ease),transform 1s var(--ease),filter .9s var(--ease)}
.js [data-anim=rise]{transform:translateY(40px)}
.js [data-anim=slide-left]{transform:translateX(-90px) rotate(-2.5deg)}
.js [data-anim=slide-right]{transform:translateX(90px) rotate(2.5deg)}
.js [data-anim=flip-up]{transform:perspective(1000px) rotateX(-50deg) translateY(50px);transform-origin:50% 0}
.js [data-anim=zoom-blur]{transform:scale(.84);filter:blur(16px)}
.js [data-anim=swing]{transform:perspective(1200px) rotateY(-62deg) translateX(-50px);transform-origin:0 50%}
.js [data-anim].in{opacity:1;transform:none;filter:none}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:start}
.about-copy p{color:var(--muted);font-size:1.08rem;max-width:58ch;margin-bottom:20px}
.about-copy strong{color:var(--text);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px;max-width:520px}
.stat{border-top:2px solid var(--gold);padding-top:14px}
.stat b{display:block;font-family:var(--display);font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;line-height:1}
.stat i{font-style:normal}
.stat small{color:var(--muted);font-size:.88rem;display:block;margin-top:6px;line-height:1.35}
.tilt{transition:transform .25s var(--ease);will-change:transform}
.spec{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:30px}
.spec::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(245,194,66,.15),transparent 60%)}
.spec-row{position:relative;display:flex;justify-content:space-between;gap:24px;padding:16px 0;border-bottom:1px dashed var(--line)}
.spec-row:last-child{border-bottom:0}
.spec dt{color:var(--muted);font-size:.9rem}
.spec dd{font-weight:600;text-align:right}
.js .spec-row{opacity:0}
.spec.in .spec-row{animation:fadeX .7s var(--ease) both;animation-delay:calc(var(--i)*110ms + 300ms)}
@keyframes fadeX{from{opacity:0;translate:26px 0}to{opacity:1;translate:0 0}}

/* ---------- skills ---------- */
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.skill-panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;transition:border-color .3s}
.skill-panel:hover{border-color:var(--gold-soft)}
.skill-panel h3{font-family:var(--display);font-size:1.35rem;margin-bottom:6px}
.skill-panel p{color:var(--muted);font-size:.93rem;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.skill{padding:8px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:.9rem;font-weight:500;
  transition:transform .25s var(--ease),border-color .25s,color .25s}
.skill:hover{transform:translateY(-4px) rotate(-2deg);border-color:var(--gold);color:var(--gold)}
.js .skill{opacity:0}
.chips.in .skill{animation:chipIn .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*80ms)}
@keyframes chipIn{from{opacity:0;scale:.4;rotate:-14deg}to{opacity:1;scale:1;rotate:0deg}}

/* ---------- projects ---------- */
.projects{display:flex;flex-direction:column;gap:30px}
.project{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:border-color .3s,opacity .9s var(--ease),transform 1s var(--ease),filter .9s var(--ease)}
.project:nth-child(even) .pvis{order:-1}
.project::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),rgba(245,194,66,.10),transparent 60%)}
.project:hover::before{opacity:1}
.project:hover{border-color:var(--gold-soft)}
.pinfo{position:relative;z-index:2;padding:46px;display:flex;flex-direction:column;justify-content:center}
.pinfo h3{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.1;letter-spacing:-.02em;margin-bottom:14px}
.pinfo p{color:var(--muted);max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{font-size:.8rem;font-weight:600;color:var(--gold);background:rgba(245,194,66,.09);border:1px solid rgba(245,194,66,.25);padding:5px 12px;border-radius:999px}
.plinks{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.plinks:empty{display:none}
.plinks a{font-weight:600;font-size:.92rem;padding:10px 18px;border-radius:10px;border:1px solid var(--line);transition:border-color .25s,color .25s}
.plinks a:hover{border-color:var(--gold);color:var(--gold)}
.pvis{position:relative;min-height:360px;display:grid;place-items:center;background:var(--panel2);overflow:hidden;padding:32px}
.pvis::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
.pvis>*{position:relative}

/* project 1: browser mockup builds itself */
.browser{width:min(100%,380px);background:#0b1a2c;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.85);transition:transform .7s var(--ease)}
.project:hover .browser{transform:perspective(900px) rotateY(-10deg) rotateX(4deg) scale(1.03)}
.browser .bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.browser .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock{padding:14px;display:grid;gap:12px}
.mock .nv{display:flex;align-items:center;gap:8px}
.mock .nv b{width:34px;height:8px;background:var(--gold);border-radius:4px}
.mock .nv span{width:22px;height:5px;background:var(--line);border-radius:3px}
.mock .nv span:first-of-type{margin-left:auto}
.mock .hr{display:grid;gap:7px;padding:10px 0}
.mock .hr h5{height:12px;border-radius:6px;background:var(--text);width:70%;opacity:.9}
.mock .hr h5.s{width:48%;background:var(--muted);height:9px}
.mock .hr em{width:64px;height:18px;border-radius:6px;background:var(--gold);margin-top:6px}
.mock .cs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mock .cs u{height:52px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.mock .ac{display:grid;gap:6px}
.mock .ac p{height:20px;border-radius:6px;background:var(--panel);border:1px solid var(--line);position:relative}
.mock .ac p::after{content:'';position:absolute;right:9px;top:5px;width:6px;height:6px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg)}
.js .mock .b,.js .mock .cs u{opacity:0}
.project.in .mock .b{animation:build .7s var(--ease) both;animation-delay:calc(var(--i)*170ms + 500ms)}
.project.in .mock .cs u{animation:build .6s var(--ease) both;animation-delay:calc(var(--j)*130ms + 1000ms)}
.project.in .mock .ac p:nth-child(2){animation:accordion 4s ease-in-out 2.6s infinite}
@keyframes build{from{opacity:0;translate:0 16px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
@keyframes accordion{0%,100%{height:20px}35%,65%{height:52px}}

/* project 2: routine checklist ticks itself off */
.routine{width:min(100%,340px);background:#0b1a2c;border:1px solid var(--line);border-radius:
